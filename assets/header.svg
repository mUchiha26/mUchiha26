<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Yasseene: Security-first computer engineering student">
<style>text{font-family:JetBrains Mono, Fira Code, SF Mono, Menlo, Consolas, monospace}@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(280px)}}@keyframes blink{50%{opacity:0}}.scan{animation:scan 7s linear infinite}.cur{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e2d4a" opacity=".5"/></pattern>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset="1" stop-color="#3b82f6" stop-opacity=".22"/></linearGradient>
<clipPath id="c"><rect width="1000" height="240" rx="16"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1000" height="240" fill="#0b1020"/><rect width="1000" height="240" fill="url(#g)"/>
<rect class="scan" width="1000" height="40" fill="url(#s)"/></g>
<rect x=".5" y=".5" width="999" height="239" rx="16" fill="none" stroke="#1e2d4a"/>
<text x="56" y="112" font-size="56" font-weight="700" fill="#d6e2ff">Yasseene<tspan class="cur" fill="#3b82f6">_</tspan></text>
<text x="58" y="156" font-size="18" fill="#5aa9ff">Security-first computer engineering student</text>
<text x="58" y="186" font-size="14" fill="#7d8fb3">Offensive and defensive tooling, with AI where it earns its place.</text>
</svg>
